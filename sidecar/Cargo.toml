[package]
name = "sidecar"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
serpentine_internal.workspace = true

log.workspace = true
simple_logger = { version = "5.2.0", default-features = false }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "fs"] }
nix = { workspace = true, features = ["fs", "mount"] }
uuid.workspace = true
rust-cni = { version = "0.1.2", default-features = false }
netns-rs = { version = "0.2.0", default-features = false }
typed-path.workspace = true
async-tar = { version = "0.6.1", default-features = false, features = ["tokio", "xattr", "runtime-tokio"] }
async-walkdir = "2.1.0"
tokio-stream.workspace = true
async-fs = "2.2.0"
xattr = { version = "1.6.1", default-features = false }
[lints]
workspace = true
