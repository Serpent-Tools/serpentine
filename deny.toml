[bans]
multiple-versions = "allow"
wildcards = "deny"

[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[bans.std-replacements]
level = "deny"
scope = "workspace"

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[licenses]
unused-allowed-license = "deny"
allow = [
    "MIT",
    "Unicode-3.0",
    "Apache-2.0",
    "MPL-2.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
    "BSD-3-Clause",
]
