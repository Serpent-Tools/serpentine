name: Security Scan
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: serpent-tools/containerd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export Docker image
        run: |
          mkdir -p target
          docker save serpent-tools/containerd:dev -o target/containerd.tar
      - name: Run security scan
        run: cargo run -p serpentine --locked -- run --ci --entry-point SECURITY --jobs 1 2>/tmp/serpentine_stderr.log
      - name: Surface security scan errors
        if: failure()
        run: |
          cat /tmp/serpentine_stderr.log >&2
          {
            echo "## Security Scan Failed"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/serpentine_stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Security scan failed: $(head -1 /tmp/serpentine_stderr.log)"
      - name: Create or update issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const stderr = fs.readFileSync('/tmp/serpentine_stderr.log', 'utf8')
              .replace(/\x1b\[[0-9;]*m/g, '');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security-scan',
              state: 'open',
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const body = stderr.slice(0, 60000);

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `## Security scan still failing (${date})\n\nWorkflow run: ${runUrl}\n\n\`\`\`\n${body}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Security scan failure: ${date}`,
                labels: ['security-scan'],
                body: `The scheduled security scan found issues.\n\nWorkflow run: ${runUrl}\n\n\`\`\`\n${body}\n\`\`\``,
              });
            }
