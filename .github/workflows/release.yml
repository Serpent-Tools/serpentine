name: Release serpentine
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CONTAINERD_IMAGE: serpent-tools/containerd
  PAGES_PROJECT: serpentine
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # A release build pulls the engine image by crate version, so the tag has to agree.
      - name: Check the tag agrees with the manifests
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          mismatched=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg want "$version" '.packages[] | select(.version != $want) | "\(.name) is \(.version)"')
          if [ -n "$mismatched" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} wants $version, but $mismatched"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the crates package cleanly
        run: cargo package --workspace --locked

  build-image:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.CONTAINERD_IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.CONTAINERD_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export Docker image
        run: |
          docker save \
            "$CONTAINERD_IMAGE:${{ needs.verify.outputs.version }}" \
            "$CONTAINERD_IMAGE:latest" \
            | zstd -T0 -3 -o /tmp/containerd.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containerd-image
          path: /tmp/containerd.tar.zst
          retention-days: 1

  build-binaries:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # aws-lc-sys needs a C compiler targeting musl.
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-about@0.9.2
      - name: Generate the dependency licenses
        run: >
          cargo about generate -c about.toml -m serpentine/Cargo.toml
          --target ${{ matrix.target }} about.hbs -o THIRD-PARTY.md

      - name: Build
        run: cargo build --release --locked -p serpentine --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          staging="serpentine-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$staging"
          cp LICENSE README.md THIRD-PARTY.md "$staging/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/serpentine.exe" "$staging/"
            7z a "$staging.zip" "$staging"
            echo "archive=$staging.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/serpentine" "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            echo "archive=$staging.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  build-book:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: mdbook@0.5.4
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: mdbook-mermaid@0.17.1

      # The assets book.toml lists under additional-js are gitignored, so regenerate them.
      - name: Build the book
        run: |
          mdbook-mermaid install book
          mdbook build book

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: book/book
          retention-days: 1

  # Everything below publishes, so gate the first push on every build succeeding.
  publish-image:
    needs: [verify, build-image, build-binaries, build-book]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: /tmp
      - name: Load Docker image
        run: zstd -d /tmp/containerd.tar.zst --stdout | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the engine image
        run: |
          docker push "$CONTAINERD_IMAGE:${{ needs.verify.outputs.version }}"
          docker push "$CONTAINERD_IMAGE:latest"

  # Strictly after the image: a published crate immediately pulls that tag.
  publish-crates:
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # `sidecar` is `publish = false`, leaving serpentine_internal then serpentine.
      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-release:
    needs: [verify, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Checksum the archives
        run: cd dist && sha256sum serpentine-* > SHA256SUMS
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-book:
    needs: [verify, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: book
          path: book
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy book --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
