name: Serpentine Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: serpent-tools/containerd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export Docker image
        run: docker save serpent-tools/containerd:dev | zstd -T0 -3 -o /tmp/containerd-dev.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containerd-image
          path: /tmp/containerd-dev.tar.zst
          retention-days: 1

  test:
    needs: [build-docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            runtime: docker
          - os: ubuntu-latest
            platform: linux
            runtime: podman
          - os: macos-15-intel
            platform: macos
            runtime: docker
          - os: windows-latest
            platform: windows
            runtime: docker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.140

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Container runtime setup (platform-specific) ---
      - name: Setup Podman (Linux/Podman)
        if: matrix.runtime == 'podman'
        run: |
          sudo systemctl stop docker docker.socket
          podman system service --time=0 &
          podman info

      - name: Setup Docker (macOS)
        if: matrix.platform == 'macos'
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1.1.0

      - name: Setup WSL (Windows)
        if: matrix.platform == 'windows'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-22.04
          additional-packages: zstd

      # WSL shuts the VM down once it looks idle, which it does while the tests compile. A
      # long-lived D-Bus session keeps the distro up until the job ends.
      - name: Keep WSL alive (Windows)
        if: matrix.platform == 'windows'
        run: wsl.exe -d Ubuntu-22.04 --exec dbus-launch true

      - name: Install Docker in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://get.docker.com | sudo VERSION=29.3 sh
          sudo usermod -aG docker $USER

      # The tests run on the Windows side, so the daemon needs a TCP listener. `docker.socket`
      # owns /var/run/docker.sock, so it has to stop before the overridden `ExecStart` binds it.
      # Docker's default bridge pool overlaps the NAT range WSL2 picks, which breaks forwarding
      # from the Windows host, so pin it well clear of 172.16.0.0/12.
      - name: Start Docker daemon in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          printf '{"default-address-pools":[{"base":"10.200.0.0/16","size":24}]}\n' \
            | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H unix:///var/run/docker.sock -H tcp://0.0.0.0:2375\n' \
            | sudo tee /etc/systemd/system/docker.service.d/tcp-listener.conf
          sudo systemctl stop docker.socket
          sudo systemctl daemon-reload
          sudo systemctl restart docker.service
          for i in $(seq 1 15); do
            if docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i)"
            sleep 2
          done
          docker -H tcp://127.0.0.1:2375 info

      # --- Load Docker image ---
      - name: Download Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: ${{ runner.temp }}

      - name: Load Docker image (Linux/macOS)
        if: matrix.platform != 'windows' && matrix.runtime != 'podman'
        run: zstd -d ${{ runner.temp }}/containerd-dev.tar.zst --stdout | docker load

      - name: Load Podman image (Linux/Podman)
        if: matrix.runtime == 'podman'
        run: zstd -d ${{ runner.temp }}/containerd-dev.tar.zst --stdout | podman load

      - name: Load Docker image in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          wslpath '${{ runner.temp }}/containerd-dev.tar.zst' | xargs zstd -d --stdout | docker load

      # WSL's localhost forwarding is unreliable here, so fall back to addressing the VM directly.
      - name: Set DOCKER_HOST (Windows)
        if: matrix.platform == 'windows'
        run: |
          $wslIp = (wsl.exe -d Ubuntu-22.04 hostname -I) -split '\s+' | Where-Object { $_ } | Select-Object -First 1
          Write-Host "WSL IP: $wslIp"
          foreach ($candidate in @("127.0.0.1", $wslIp)) {
            try {
              Invoke-RestMethod -Uri "http://${candidate}:2375/_ping" -TimeoutSec 5 | Out-Null
              Write-Host "Daemon reachable at ${candidate}:2375"
              "DOCKER_HOST=tcp://${candidate}:2375" >> $env:GITHUB_ENV
              exit 0
            } catch {
              Write-Host "No daemon at ${candidate}:2375 - $($_.Exception.Message)"
            }
          }
          throw "WSL Docker daemon unreachable from Windows"

      # --- Run tests ---
      # `--test-threads=1`: CI runners can't sustain several pipelines driving the shared
      # containerd at once (fifo copy deadlines), so run them serially here. Local runs stay
      # parallel to keep surfacing cross-process races.
      - name: Run tests (Linux/Docker)
        if: matrix.platform == 'linux' && matrix.runtime != 'podman'
        run: cargo nextest run --features _test_docker --fail-fast --test-threads=1
        env:
          RUST_LOG: serpentine=trace

      - name: Run integration tests (macOS/Windows/Podman)
        if: matrix.platform != 'linux' || matrix.runtime == 'podman'
        run: cargo nextest run -p serpentine --features _test_docker --profile integration_tests --fail-fast --test-threads=1
        env:
          RUST_LOG: serpentine=trace

      - name: Dump WSL Docker state (Windows)
        if: failure() && matrix.platform == 'windows'
        run: |
          Write-Host "DOCKER_HOST=$env:DOCKER_HOST"
          wsl.exe -l -v
          wsl.exe -d Ubuntu-22.04 -- sh -c "hostname -I; ss -ltnp | grep 2375; systemctl is-active docker"
          curl.exe -sS -m 5 -o - "$($env:DOCKER_HOST -replace '^tcp','http')/_ping"

  lint:
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-restore
        with:
          path: /tmp/serpentine_cache
          key: serpentine_cache-${{ github.sha }}
          restore-keys: serpentine_cache-
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: /tmp
      - name: Load Docker image
        run: |
          mkdir -p target
          zstd -d /tmp/containerd-dev.tar.zst --stdout | tee target/containerd.tar | docker load
      - name: Run serpentine pipeline
        run: cargo run -p serpentine --locked -- run --cache /tmp/serpentine_cache --standalone-cache --clean-old --ci --entry-point LINTS --jobs 1 2>/tmp/serpentine_stderr.log
      - name: Surface pipeline errors
        if: failure()
        run: |
          cat /tmp/serpentine_stderr.log >&2
          {
            echo "## Lint Pipeline Failed"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/serpentine_stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Lint pipeline failed: $(head -1 /tmp/serpentine_stderr.log)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /tmp/serpentine_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  security-scan:
    needs: [build-docker]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-restore
        with:
          path: /tmp/serpentine_cache
          key: security_cache-${{ github.sha }}
          restore-keys: security_cache-
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '34.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: /tmp
      - name: Load Docker image
        run: |
          mkdir -p target
          zstd -d /tmp/containerd-dev.tar.zst --stdout | tee target/containerd.tar | docker load
      - name: Run security scan
        run: cargo run -p serpentine --locked -- run --cache /tmp/serpentine_cache --standalone-cache --clean-old --ci --entry-point SECURITY --jobs 1 2>/tmp/serpentine_stderr.log
      - name: Surface security scan errors
        if: failure()
        run: |
          cat /tmp/serpentine_stderr.log >&2
          {
            echo "## Security Scan Failed"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/serpentine_stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Security scan failed: $(head -1 /tmp/serpentine_stderr.log)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /tmp/serpentine_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  all-checks:
    if: always()
    needs: [test, lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: security-scan
          jobs: ${{ toJSON(needs) }}
