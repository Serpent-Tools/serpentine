name: Serpentine Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: serpent-tools/containerd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export Docker image
        run: docker save serpent-tools/containerd:dev | zstd -T0 -3 -o /tmp/containerd-dev.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containerd-image
          path: /tmp/containerd-dev.tar.zst
          retention-days: 1

  test:
    needs: [build-docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            runtime: docker
          - os: ubuntu-latest
            platform: linux
            runtime: podman
          - os: macos-15-intel
            platform: macos
            runtime: docker
          - os: windows-latest
            platform: windows
            runtime: docker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.140

      # --- Protobuf (platform-specific) ---
      - name: Install protobuf (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y protobuf-compiler
      - name: Install protobuf (macOS)
        if: matrix.platform == 'macos'
        run: brew install protobuf@33
      - name: Install protobuf (Windows)
        if: matrix.platform == 'windows'
        run: choco install protoc --version=34.1.0 -y

      # --- Container runtime setup (platform-specific) ---
      - name: Setup Podman (Linux/Podman)
        if: matrix.runtime == 'podman'
        run: |
          sudo systemctl stop docker docker.socket
          podman system service --time=0 &
          podman info

      - name: Setup Docker (macOS)
        if: matrix.platform == 'macos'
        uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1.1.0

      - name: Setup WSL (Windows)
        if: matrix.platform == 'windows'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-22.04
          additional-packages: zstd

      - name: Install Docker in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://get.docker.com | sudo VERSION=29.3 sh
          sudo usermod -aG docker $USER

      - name: Start Docker daemon in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          sudo dockerd -H tcp://0.0.0.0:2375 -H unix:///var/run/docker.sock &
          for i in $(seq 1 15); do
            if docker info >/dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            echo "Waiting for Docker... ($i)"
            sleep 2
          done
          docker info

      # --- Load Docker image ---
      - name: Download Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: ${{ runner.temp }}

      - name: Load Docker image (Linux/macOS)
        if: matrix.platform != 'windows' && matrix.runtime != 'podman'
        run: zstd -d ${{ runner.temp }}/containerd-dev.tar.zst --stdout | docker load

      - name: Load Podman image (Linux/Podman)
        if: matrix.runtime == 'podman'
        run: zstd -d ${{ runner.temp }}/containerd-dev.tar.zst --stdout | podman load

      - name: Load Docker image in WSL (Windows)
        if: matrix.platform == 'windows'
        shell: wsl-bash {0}
        run: |
          wslpath '${{ runner.temp }}/containerd-dev.tar.zst' | xargs zstd -d --stdout | docker load

      - name: Set DOCKER_HOST (Windows)
        if: matrix.platform == 'windows'
        run: echo "DOCKER_HOST=tcp://localhost:2375" >> $env:GITHUB_ENV

      # --- Run tests ---
      # `--test-threads=1`: CI runners can't sustain several pipelines driving the shared
      # containerd at once (fifo copy deadlines), so run them serially here. Local runs stay
      # parallel to keep surfacing cross-process races.
      - name: Run tests (Linux/Docker)
        if: matrix.platform == 'linux' && matrix.runtime != 'podman'
        run: cargo nextest run --features _test_docker --fail-fast --test-threads=1
        env:
          RUST_LOG: serpentine=trace

      - name: Run integration tests (macOS/Windows/Podman)
        if: matrix.platform != 'linux' || matrix.runtime == 'podman'
        run: cargo nextest run -p serpentine --features _test_docker --profile integration_tests --fail-fast --test-threads=1
        env:
          RUST_LOG: serpentine=trace

  lint:
    needs: [build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-restore
        with:
          path: /tmp/serpentine_cache
          key: serpentine_cache-${{ github.sha }}
          restore-keys: serpentine_cache-
      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: /tmp
      - name: Load Docker image
        run: |
          mkdir -p target
          zstd -d /tmp/containerd-dev.tar.zst --stdout | tee target/containerd.tar | docker load
      - name: Run serpentine pipeline
        run: cargo run -p serpentine --locked -- run --cache /tmp/serpentine_cache --standalone-cache --clean-old --ci --entry-point LINTS --jobs 1 2>/tmp/serpentine_stderr.log
      - name: Surface pipeline errors
        if: failure()
        run: |
          cat /tmp/serpentine_stderr.log >&2
          {
            echo "## Lint Pipeline Failed"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/serpentine_stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Lint pipeline failed: $(head -1 /tmp/serpentine_stderr.log)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /tmp/serpentine_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  security-scan:
    needs: [build-docker]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-restore
        with:
          path: /tmp/serpentine_cache
          key: security_cache-${{ github.sha }}
          restore-keys: security_cache-
      - name: Install protobuf
        run: sudo apt-get install -y protobuf-compiler
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containerd-image
          path: /tmp
      - name: Load Docker image
        run: |
          mkdir -p target
          zstd -d /tmp/containerd-dev.tar.zst --stdout | tee target/containerd.tar | docker load
      - name: Run security scan
        run: cargo run -p serpentine --locked -- run --cache /tmp/serpentine_cache --standalone-cache --clean-old --ci --entry-point SECURITY --jobs 1 2>/tmp/serpentine_stderr.log
      - name: Surface security scan errors
        if: failure()
        run: |
          cat /tmp/serpentine_stderr.log >&2
          {
            echo "## Security Scan Failed"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/serpentine_stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Security scan failed: $(head -1 /tmp/serpentine_stderr.log)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: /tmp/serpentine_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  all-checks:
    if: always()
    needs: [test, lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: security-scan
          jobs: ${{ toJSON(needs) }}
